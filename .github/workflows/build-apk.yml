
name: Build NEO Apple TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip NEOAppleTV_phone_build.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p NEOAppleTV assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEO-Apple-TV
          path: NEOAppleTV/app/build/outputs/apk/debug/app-debug.apk
